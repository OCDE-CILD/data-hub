<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance & Engagement | OCDE Data Hub</title>
  <style>
    :root {
      --navy: #0b2e59;
      --blue: #0b5ed7;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #10233e;
      --muted: #5b6b84;
      --line: #d8e1ee;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .topbar {
      background: var(--navy);
      color: white;
      padding: 18px 32px;
    }

    .topbar .brand {
      font-size: 28px;
      font-weight: 700;
      margin: 0;
    }

    .topbar .sub {
      margin: 6px 0 0;
      color: rgba(255,255,255,0.82);
      font-size: 14px;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 20px 56px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 8px 24px rgba(16, 35, 62, 0.05);
    }

    .panel h1 {
      margin: 0 0 10px;
      font-size: 36px;
    }

    .panel p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.5;
    }

    .button {
      display: inline-block;
      background: var(--blue);
      color: white;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 700;
      margin-right: 10px;
      margin-top: 8px;
    }

    .button.secondary {
      background: white;
      color: var(--navy);
      border: 1px solid var(--line);
    }

    .tableau-wrapper {
      margin-top: 20px;
      background: white;
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(16,35,62,0.08);
      overflow: hidden;
    }

    .tableauPlaceholder {
      width: 100% !important;
    }

    .tableauViz {
      width: 100% !important;
      min-height: 900px !important;
    }
  </style>
</head>
  
<body>
  <div class="topbar">
    <p class="brand">OCDE Data Hub</p>
    <p class="sub">College & Career</p>
  </div>

  <div class="nav">
    <a href="index.html">Home</a>
    <a href="attendance.html">Attendance</a>
    <a href="college-career.html">College & Career</a>
    <a href="academics.html">Academics</a>
  </div>

  <main class="wrap">
    
    <section class="panel">
      <h1>Chronic Absenteeism Dashboard</h1>
      <p>
        Explore attendance patterns, subgroup trends, and year-over-year chronic absenteeism rates.
      </p>

      <a class="button" href="index.html">Back to Home</a>
      <a class="button secondary" href="#">View Data Notes</a>

      <div class="tableau-wrapper">
        <!-- PASTE THE TABLEAU EMBED CODE HERE -->
      </div>
    </section>
  </main>
</body>
</html>
