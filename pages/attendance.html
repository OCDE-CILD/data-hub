<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance & Engagement | OCDE Data Hub</title>

  <style>
    :root {
      --navy: #0b2e59;
      --blue: #0b5ed7;
      --blue-2: #0a4db8;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #10233e;
      --muted: #5b6b84;
      --line: #d8e1ee;
      --shadow: 0 10px 28px rgba(16, 35, 62, 0.06);
      --header-h: 92px;
      --footer-h: 44px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    a { color: inherit; }

    .app-shell {
      min-height: 100vh;
    }

    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: linear-gradient(180deg, #0a2b57 0%, #092748 100%);
      color: #fff;
      border-bottom: 1px solid rgba(255,255,255,0.11);
      box-shadow: 0 4px 18px rgba(6, 20, 43, 0.22);
    }

    .header-inner {
      max-width: 1600px;
      margin: 0 auto;
      padding: 8px 18px 8px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      min-width: 0;
    }

    .brand-block {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      flex: 0 0 auto;
    }

    .brand-logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
      flex: 0 0 auto;
      margin-left: 2px;
    }

    .brand-copy {
      min-width: 0;
      padding-top: 1px;
    }

    .brand {
      margin: 0;
      font-family: "Avenir Next", "Segoe UI", Arial, sans-serif;
      font-size: 28px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.045em;
      white-space: nowrap;
    }

    .sub {
      margin-top: 5px;
      font-family: "Avenir Next", "Segoe UI", Arial, sans-serif;
      font-size: 13px;
      line-height: 1.1;
      font-weight: 600;
      color: rgba(255,255,255,0.88);
      white-space: nowrap;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 18px;
      flex: 1 1 auto;
      min-width: 0;
      padding-top: 28px;
      padding-right: 6px;
      flex-wrap: wrap;
    }

    .nav a {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      opacity: 0.96;
      line-height: 1;
      padding: 6px 0 7px;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    }

    .nav a.active {
      border-bottom: 3px solid rgba(255,255,255,0.96);
    }

    .nav a:hover {
      text-decoration: underline;
    }

    .content {
      padding-top: calc(var(--header-h) + 10px);
      padding-bottom: calc(var(--footer-h) + 12px);
      background:
        radial-gradient(circle at 20% 8%, rgba(46, 118, 214, 0.07), transparent 28%),
        radial-gradient(circle at 92% 16%, rgba(183, 213, 255, 0.16) 0 3px, transparent 4px) 0 0 / 22px 22px,
        linear-gradient(180deg, #f7fbff 0%, var(--bg) 100%);
    }

    .wrap {
      max-width: 1600px;
      margin: 0 auto;
      padding: 0 18px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
      padding: 0;
    }

    .tableau-shell {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0;
      margin: 0;
    }

    .tableau-frame {
      width: 100%;
      max-width: 1380px;
      margin: 0 auto;
      padding: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    .tableauPlaceholder {
      width: 100% !important;
      position: relative;
      margin: 0 auto;
    }

    .tableauViz {
      width: 100% !important;
      min-height: 927px !important;
      display: block;
    }

    .site-footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1000;
      background: linear-gradient(180deg, #0a2b57 0%, #092748 100%);
      color: #fff;
      border-top: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 -4px 18px rgba(6, 20, 43, 0.18);
      padding: 10px 22px;
    }

    .footer-inner {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-width: 0;
      font-size: 13px;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .footer-logo {
      width: 28px;
      height: 28px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .footer-center,
    .footer-right {
      color: rgba(255,255,255,0.88);
      white-space: nowrap;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    .icon {
      width: 1em;
      height: 1em;
      display: inline-block;
      flex: 0 0 auto;
    }

    .header-inner,
    .footer-inner {
      max-width: none;
      width: 100%;
      margin: 0;
    }

    @media (max-width: 900px) {
      :root {
        --header-h: 112px;
        --footer-h: 56px;
      }

      .header-inner {
        flex-direction: column;
        align-items: flex-start;
        padding: 8px 14px 10px;
      }

      .nav {
        padding-top: 0;
        justify-content: flex-start;
        gap: 14px;
      }

      .brand {
        font-size: 24px;
      }

      .sub {
        white-space: normal;
      }

      .content {
        padding-top: calc(var(--header-h) + 10px);
        padding-bottom: calc(var(--footer-h) + 12px);
      }

      .wrap {
        padding: 0 12px;
      }

      .footer-inner {
        flex-wrap: wrap;
      }

      .footer-center,
      .footer-right {
        white-space: normal;
      }

      .tableauViz {
        min-height: 780px !important;
      }
    }
  </style>
</head>

<body>

          <img src="ocde-logo.png" alt="OCDE logo" class="brand-logo" />
          <div class="brand-copy">
            <div class="brand">OCDE Data Hub</div>

        </div>

        <nav class="nav" aria-label="Primary navigation">

    <main class="content">

      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-left">
          <img src="ocde-logo.png" alt="OCDE logo" class="footer-logo" />
          <span>Orange County Department of Education</span>
        </div>
        <div class="footer-center">Data is updated regularly. Please review data notes for details.</div>
        <div class="footer-right">Questions? Contact our Data Team</div>
      </div>
    </footer>
  </div>
</body>
</html>
