<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="assets/images/Mark-COLOR.png" />
  <title>Sign In | OCDE Data Hub</title>
  <style>
    :root {
      --navy: #0b2f5b;
      --blue: #135ad6;
      --blue-2: #0f4fbf;
      --bg: #f4f8fd;
      --text: #10233e;
      --muted: #5b6b84;
      --line: #d8e2ef;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 8%, rgba(46, 118, 214, 0.14), transparent 32%),
        radial-gradient(circle at 85% 90%, rgba(120, 170, 255, 0.14), transparent 30%),
        linear-gradient(180deg, #0a2b57 0%, #092748 55%, #0b2f5b 100%);
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(6, 20, 43, 0.35);
      padding: 36px 32px 30px;
      text-align: center;
    }

    .brand-logo {
      width: 56px;
      height: 56px;
      object-fit: contain;
      margin: 0 auto 14px;
      display: block;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      margin-bottom: 14px;
      border-radius: 999px;
      background: #eaf2ff;
      color: #1d4ed8;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--navy);
    }

    .subtitle {
      margin: 0 0 26px;
      font-size: 14px;
      line-height: 1.5;
      color: var(--muted);
    }

    .signin-button {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #ffffff;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(16, 35, 62, 0.06);
      transition: box-shadow 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
    }

    .signin-button:hover {
      border-color: #bcd0ea;
      box-shadow: 0 6px 16px rgba(16, 35, 62, 0.1);
    }

    .signin-button:active {
      transform: translateY(1px);
    }

    .signin-button:disabled {
      opacity: 0.6;
      cursor: default;
      box-shadow: none;
    }

    .signin-button svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .status {
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.5;
      min-height: 18px;
    }

    .status.error {
      color: #c0362c;
    }

    .status.info {
      color: var(--muted);
    }

    .footer-note {
      margin-top: 26px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      line-height: 1.5;
      color: var(--muted);
    }

    .footer-note a {
      color: #1d4ed8;
      text-decoration: none;
      font-weight: 600;
    }

    .footer-note a:hover {
      text-decoration: underline;
    }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main class="card">
    <img src="assets/images/Logo-WHITE" alt="OCDE logo" class="brand-logo" />
    <div class="eyebrow">Preview Access</div>
    <h1>OCDE Data Hub</h1>
    <p class="subtitle">This site is in preview and limited to authorized reviewers. Sign in with your Google account to continue.</p>

    <div id="gis-button" style="display: flex; justify-content: center;"></div>
    <button id="fallback-note" class="signin-button" type="button" style="display: none;" disabled>
      Loading sign-in…
    </button>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <div class="footer-note">
      Not seeing access after signing in? Reach out to the Research &amp; Evaluation team to be added to the reviewer list.
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithCredential,
      onAuthStateChanged,
      signOut,
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { firebaseConfig, GOOGLE_CLIENT_ID, isAuthorized } from "./assets/js/firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const gisButton = document.getElementById("gis-button");
    const fallbackNote = document.getElementById("fallback-note");
    const status = document.getElementById("status");

    function setStatus(message, type) {
      status.textContent = message || "";
      status.className = "status" + (type ? ` ${type}` : "");
    }

    function getNextUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("next") || "index.html";
    }

    // Surface why the person landed here, if auth-check.js sent them.
    const reason = new URLSearchParams(window.location.search).get("reason");
    if (reason === "unauthorized") {
      setStatus("That Google account isn't on the reviewer list yet. Try a different account or contact the team below.", "error");
    }

    // Called by Google's library once the person picks an account. `response`
    // contains a signed ID token — we hand that to Firebase directly instead
    // of using Firebase's own popup/redirect flow, since that flow requires a
    // cross-origin hop through the Firebase auth domain that browsers were
    // blocking. This path is same-origin the whole way, so it's more reliable.
    async function handleCredentialResponse(response) {
      setStatus("Signing in…", "info");
      try {
        const credential = GoogleAuthProvider.credential(response.credential);
        const result = await signInWithCredential(auth, credential);

        if (!isAuthorized(result.user)) {
          await signOut(auth);
          setStatus("That Google account isn't on the reviewer list yet. Try a different account or contact the team below.", "error");
          return;
        }

        setStatus("Signed in — redirecting…", "info");
        window.location.replace(getNextUrl());
      } catch (err) {
        console.error(err);
        setStatus("Sign-in didn't go through. Please try again.", "error");
      }
    }

    function initGis() {
      if (!window.google || !window.google.accounts || !window.google.accounts.id) {
        // Google's script hasn't finished loading yet — try again shortly.
        setTimeout(initGis, 150);
        return;
      }

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse,
      });

      google.accounts.id.renderButton(gisButton, {
        type: "standard",
        theme: "outline",
        size: "large",
        text: "signin_with",
        shape: "pill",
        width: 320,
      });

      fallbackNote.style.display = "none";
      gisButton.style.display = "flex";
    }

    initGis();

    // Already signed in and authorized? Skip straight through.
    onAuthStateChanged(auth, (user) => {
      if (user && isAuthorized(user)) {
        window.location.replace(getNextUrl());
      }
    });
  </script>
</body>
</html>
