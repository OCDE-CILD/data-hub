
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College & Career | OCDE Data Hub</title>

  <style>
    :root {
      --navy: #0b2e59;
      --blue: #0b5ed7;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #10233e;
      --muted: #5b6b84;
      --line: #d8e1ee;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .topbar {
      background: var(--navy);
      color: white;
      padding: 18px 32px;
    }

    .brand {
      font-size: 28px;
      font-weight: 700;
      margin: 0;
    }

    .sub {
      margin-top: 6px;
      color: rgba(255,255,255,0.82);
      font-size: 14px;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 20px 56px;
    }

    .panel {
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(16,35,62,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 36px;
    }

    p {
      color: var(--muted);
      line-height: 1.5;
    }

    .button {
      display: inline-block;
      background: var(--blue);
      color: white;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 700;
      margin-right: 10px;
      margin-top: 8px;
    }

    .button.secondary {
      background: white;
      color: var(--navy);
      border: 1px solid var(--line);
    }

    .tableau-wrapper {
      margin-top: 24px;
      background: white;
      border-radius: 18px;
      overflow: hidden;
    }

    .tableauPlaceholder {
      width: 100% !important;
    }

    .tableauViz {
      width: 100% !important;
      min-height: 900px !important;
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="brand">OCDE Data Hub</div>
    <div class="sub">College & Career</div>
  </div>

  <main class="wrap">

    <section class="panel">

      <h1>College & Career Dashboard</h1>

      <p>
        Explore preparedness indicators, FAFSA completion,
        pathway participation, and career readiness metrics.
      </p>

      <a class="button" href="index.html">
        Back to Home
      </a>

      <a class="button secondary" href="#">
        View Data Notes
      </a>

      <div class="tableau-wrapper">

        <!-- PASTE COLLEGE/CAREER TABLEAU EMBED CODE HERE -->

      </div>

    </section>

  </main>

</body>
</html>
